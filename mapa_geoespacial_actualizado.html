  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

      minZoom: 0,
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS'
    }).addTo(map);

    // 3. Puntos de Centros (1 al 10 - Rojos)

      { id: "Centro 2", lat: 24.85162641, lng: -107.49831097 },

      { id: "Centro 10", lat: 24.86615783, lng: -107.49183922 }
    ];

    centros.forEach(c => {
      L.circleMarker([c.lat, c.lng], {
        color: '#b71c1c',
        fillColor: '#e53935',
        fillOpacity: 0.85,
        radius: 8,
        weight: 2
      }).bindPopup(`<b>${c.id}</b>`).addTo(map);
    });
